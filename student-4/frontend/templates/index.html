<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account & Dashboard - NextStop</title>
    <link rel="stylesheet" href="/shared/css/theme.css">
    <script src="/shared/js/htmx.min.js"></script>
</head>
<body>
<main class="app-shell">
    <header class="app-header card">
        <h1>Account & Dashboard</h1>
        <p>Student 4 &middot; Aurelia Sari &middot; <a href="/" style="color:var(--accent)">back to all features</a></p>
    </header>

    <nav class="tab-nav">
        <button class="tab-btn is-active" data-tab="accounts" type="button">Accounts</button>
        <button class="tab-btn" data-tab="ai" type="button">AI mode</button>
    </nav>

    <section class="tab-panel is-active card" id="panel-accounts">
        <div id="accounts-panel"
             hx-get="/api/student-4/users"
             hx-trigger="load"
             hx-swap="innerHTML"></div>

        <p class="muted" style="margin-top:1rem">
            New accounts are created from the <a href="signup.html">sign-up page</a>,
            not here.
        </p>
    </section>

    <section class="tab-panel card" id="panel-ai">
        <h3 style="margin-top:0">NextStop AI</h3>
        <p class="muted">Runs locally through AI-Mode and Ollama.</p>

        <div class="chat-log" id="chat-log">
            <p class="muted">Ask a question about this feature's data.</p>
        </div>

        <form hx-post="/api/student-4/ai/chat"
              hx-target="#chat-log"
              hx-swap="beforeend"
              hx-on::after-request="this.reset()">
            <div class="form-grid">
                <div style="grid-column:1/-1">
                    <label>Question</label>
                    <input name="question" required>
                </div>
            </div>
            <button type="submit">Ask</button>
            <span class="spinner">thinking...</span>
        </form>
    </section>
</main>

<script>
const buttons = Array.from(document.querySelectorAll(".tab-btn"));
const panels = {
    accounts: document.getElementById("panel-accounts"),
    ai: document.getElementById("panel-ai"),
};

function activate(name) {
    buttons.forEach((b) => b.classList.toggle("is-active", b.dataset.tab === name));
    Object.entries(panels).forEach(([key, panel]) =>
        panel.classList.toggle("is-active", key === name)
    );
}

buttons.forEach((b) => b.addEventListener("click", () => activate(b.dataset.tab)));
</script>
</body>
</html>
