<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Guides - NextStop</title>
    <link rel="stylesheet" href="/shared/css/theme.css">
    <script src="/shared/js/htmx.min.js"></script>
    <script src="session.js"></script>
</head>
<body>
<main class="app-shell" id="app-shell" style="display:none">
    <header class="app-header card" style="display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;">
        <div>
            <h1>Travel Guides</h1>
            <p>Student 4 &middot; Aurelia Sari &middot; <a href="/" style="color:var(--accent)">back to all features</a></p>
        </div>
        <button type="button" class="btn-sm btn-secondary" data-signout>Sign out</button>
    </header>

    <nav class="tab-nav">
        <button class="tab-btn is-active" data-tab="guides" type="button">Guides</button>
        <button class="tab-btn" data-tab="ai" type="button">AI Assistant</button>
    </nav>

    <section class="tab-panel is-active" id="panel-guides">
        <div class="card">
            <form hx-get="/api/student-4/guides"
                  hx-target="#guides-results"
                  hx-swap="innerHTML"
                  hx-trigger="submit">
                <div class="form-grid">
                    <div style="grid-column:1/-1">
                        <label for="guides-query">City or country</label>
                        <input id="guides-query" name="query" placeholder="Search for a city or country" autocomplete="off">
                    </div>
                </div>
                <button type="submit">Search</button>
                <span class="spinner">searching...</span>
            </form>
        </div>

        <div class="card">
            <div id="guides-results"
                 hx-get="/api/student-4/guides"
                 hx-trigger="authenticated from:body"
                 hx-swap="innerHTML"></div>
        </div>
    </section>

    <section class="tab-panel card" id="panel-ai">
        <h3 style="margin-top:0">NextStop AI</h3>
        <p class="muted">Runs locally through AI-Mode and Ollama.</p>

        <div class="chat-log" id="chat-log">
            <p class="muted">Ask a question about this feature's data.</p>
        </div>

        <form hx-post="/api/student-4/ai/chat"
              hx-target="#chat-log"
              hx-swap="beforeend"
              hx-on::after-request="this.reset()">
            <div class="form-grid">
                <div style="grid-column:1/-1">
                    <label>Question</label>
                    <input name="question" required>
                </div>
            </div>
            <button type="submit">Ask</button>
            <span class="spinner">thinking...</span>
        </form>
    </section>
</main>

<script>
const buttons = Array.from(document.querySelectorAll(".tab-btn"));
const panels = {
    guides: document.getElementById("panel-guides"),
    ai: document.getElementById("panel-ai"),
};

function activate(name) {
    buttons.forEach((b) => b.classList.toggle("is-active", b.dataset.tab === name));
    Object.entries(panels).forEach(([key, panel]) =>
        panel.classList.toggle("is-active", key === name)
    );
}

buttons.forEach((b) => b.addEventListener("click", () => activate(b.dataset.tab)));

(async function () {
    const user = await NextStopSession.verifySession();
    if (!user) {
        window.location.replace("signin.html");
        return;
    }
    document.getElementById("app-shell").style.display = "";
    NextStopSession.initSignOutButtons("logout.html");
    document.body.dispatchEvent(new Event("authenticated"));
})();
</script>
</body>
</html>
