<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - NextStop</title>
    <link rel="stylesheet" href="/shared/css/theme.css">
    <script src="session.js"></script>
    <style>
        .verify-hint a {
            color: var(--color-blue-500);
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body class="verify-body">

<main class="verify-card">
    <div class="verify-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>

    <h1 class="verify-title">Forgot your password?</h1>
    <p class="verify-subtitle">Enter the email address on your account and we'll send you a link to reset your password.</p>

    <p class="notice" id="form-status" style="display:none"></p>

    <form id="forgot-password-form" novalidate>
        <div class="field-group" style="text-align:left">
            <label for="forgot-email">Email</label>
            <input id="forgot-email" name="email" type="text" placeholder="Your email" autocomplete="email" required>
            <p class="field-error" id="email-error">Enter a valid email address.</p>
        </div>

        <button type="submit" class="btn btn--pill-dark signup-submit" id="submit-btn" disabled>Send reset link</button>
    </form>

    <p class="verify-hint">Remembered your password? <a href="signin.html">Sign in</a></p>
</main>

<script>
(async function () {
    const existingUser = await NextStopSession.verifySession();
    if (existingUser) {
        window.location.replace("/");
        return;
    }

    const form = document.getElementById("forgot-password-form");
    const emailInput = document.getElementById("forgot-email");
    const emailError = document.getElementById("email-error");
    const formStatus = document.getElementById("form-status");
    const submitButton = document.getElementById("submit-btn");

    const storedEmail = sessionStorage.getItem("forgotPasswordEmail");
    if (storedEmail) {
        emailInput.value = storedEmail;
        sessionStorage.removeItem("forgotPasswordEmail");
    }

    function showFormStatus(kind, message) {
        formStatus.className = `notice notice-${kind}`;
        formStatus.textContent = message;
        formStatus.style.display = "block";
    }

    const LOCAL_PART_RE = /^(?!\.)(?!.*\.\.)[A-Za-z0-9._+-]+(?<!\.)$/;
    const DOMAIN_RE = /^(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/;

    function validateEmail(value) {
        if (!value || value.length > 254) return false;
        if ((value.match(/@/g) || []).length !== 1) return false;
        if (/\s/.test(value)) return false;

        const [localPart, domain] = value.split("@");
        if (!localPart || !domain) return false;
        if (localPart.length > 64 || domain.length > 255) return false;
        if (!LOCAL_PART_RE.test(localPart)) return false;
        if (!DOMAIN_RE.test(domain)) return false;

        return true;
    }

    function setFieldValidity(input, errorEl, isValid, isTouched) {
        if (!isTouched) return;
        input.classList.toggle("is-invalid", !isValid);
        input.classList.toggle("is-valid", isValid);
        errorEl.classList.toggle("is-visible", !isValid);
    }

    function updateSubmitState() {
        submitButton.disabled = !validateEmail(emailInput.value.trim());
    }

    let emailTouched = false;

    emailInput.addEventListener("blur", () => {
        emailTouched = true;
        setFieldValidity(emailInput, emailError, validateEmail(emailInput.value.trim()), true);
    });

    emailInput.addEventListener("input", () => {
        setFieldValidity(emailInput, emailError, validateEmail(emailInput.value.trim()), emailTouched);
        updateSubmitState();
    });

    updateSubmitState();

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();
        const emailValid = validateEmail(email);
        setFieldValidity(emailInput, emailError, emailValid, true);

        if (!emailValid) {
            return;
        }

        formStatus.style.display = "none";
        submitButton.disabled = true;

        try {
            const response = await fetch("/api/student-4/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
            });
            const data = await response.json().catch(() => ({}));

            if (response.ok) {
                sessionStorage.setItem("pendingResetEmail", email);
                window.location.href = "forgot-password-pending.html";
                return;
            }

            if (response.status === 429 && data.retry_after_seconds) {
                showFormStatus("error", data.error || "Please wait before trying again.");
                return;
            }

            showFormStatus("error", data.error || "Something went wrong. Please try again.");
        } catch (err) {
            showFormStatus("error", "Could not reach the server. Please try again.");
        } finally {
            updateSubmitState();
        }
    });
})();
</script>
</body>
</html>
