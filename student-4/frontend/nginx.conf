# student-4 frontend microservice (Account & Dashboard, Aurelia Sari).
# Resolves the shared theme and this feature's API so the page works both
# standalone (localhost:8048) and behind the unified home page.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Only effective because proxy_pass below targets a
    # VARIABLE - nginx resolves a literal hostname once at startup and refuses
    # to boot if it is missing, which made this container's start order depend
    # on the hub's and vice versa.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Readiness probe. Every other service exposes /health, so the frontends do
    # too - otherwise nothing can wait for nginx to actually bind the port, and
    # CI races the container's startup.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "student-4-frontend ok\n";
    }

    location /shared/ {
        set $shared_frontend http://shared-frontend:80;
        proxy_pass $shared_frontend;
        proxy_set_header Host $host;
    }

    location /api/student-4/ {
        set $own_api http://student-4-api:5104;
        rewrite ^/api/student-4/(.*)$ /$1 break;
        proxy_pass $own_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
