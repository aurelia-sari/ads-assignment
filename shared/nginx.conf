# Unified entry point for the integrated Group 25 travel application.
# Every student frontend and backend/API is reachable through this single
# origin, so the browser never crosses origins and HTMX needs no CORS.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. This only takes effect because every proxy_pass
    # below targets a VARIABLE: nginx resolves a literal hostname once at
    # startup and refuses to boot if it is missing, but resolves a variable per
    # request. Without this the hub cannot start until all five student
    # frontends exist, while each of those needs the hub for /shared/ - a
    # circular startup dependency that fails whichever container loses the race.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Shared theme, vendored HTMX, and shared assets.
    location /shared/ {
        root /usr/share/nginx/html;
    }

    # --- Student frontend microservices ---------------------------------
    location /student-1/ {
        set $frontend_1 http://student-1-frontend:80;
        rewrite ^/student-1/(.*)$ /$1 break;
        proxy_pass $frontend_1;
        include /etc/nginx/proxy_headers.conf;
    }
    location /student-2/ {
        set $frontend_2 http://student-2-frontend:80;
        rewrite ^/student-2/(.*)$ /$1 break;
        proxy_pass $frontend_2;
        include /etc/nginx/proxy_headers.conf;
    }
    location /student-3/ {
        set $frontend_3 http://student-3-frontend:80;
        rewrite ^/student-3/(.*)$ /$1 break;
        proxy_pass $frontend_3;
        include /etc/nginx/proxy_headers.conf;
    }
    location /student-4/ {
        set $frontend_4 http://student-4-frontend:80;
        rewrite ^/student-4/(.*)$ /$1 break;
        proxy_pass $frontend_4;
        include /etc/nginx/proxy_headers.conf;
    }
    location /student-5/ {
        set $frontend_5 http://student-5-frontend:80;
        rewrite ^/student-5/(.*)$ /$1 break;
        proxy_pass $frontend_5;
        include /etc/nginx/proxy_headers.conf;
    }

    # --- Backend/API microservices --------------------------------------
    location /api/shared/ {
        set $shared_api http://shared-api:5000;
        rewrite ^/api/shared/(.*)$ /$1 break;
        proxy_pass $shared_api;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/student-1/ {
        set $api_1 http://student-1-api:5101;
        rewrite ^/api/student-1/(.*)$ /$1 break;
        proxy_pass $api_1;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/student-2/ {
        set $api_2 http://student-2-api:5102;
        rewrite ^/api/student-2/(.*)$ /$1 break;
        proxy_pass $api_2;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/student-3/ {
        set $api_3 http://student-3-api:5103;
        rewrite ^/api/student-3/(.*)$ /$1 break;
        proxy_pass $api_3;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/student-4/ {
        set $api_4 http://student-4-api:5104;
        rewrite ^/api/student-4/(.*)$ /$1 break;
        proxy_pass $api_4;
        include /etc/nginx/proxy_headers.conf;
    }
    location /api/student-5/ {
        set $api_5 http://student-5-api:5105;
        rewrite ^/api/student-5/(.*)$ /$1 break;
        proxy_pass $api_5;
        include /etc/nginx/proxy_headers.conf;
    }
}
