# Unified entry point for the integrated Group 25 travel application.
# Every student frontend and backend/API is reachable through this single
# origin, so the browser never crosses origins and HTMX needs no CORS.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Shared theme, vendored HTMX, and shared assets.
    location /shared/ {
        root /usr/share/nginx/html;
    }

    # --- Student frontend microservices ---------------------------------
    location /student-1/ { proxy_pass http://student-1-frontend:80/; include /etc/nginx/proxy_headers.conf; }
    location /student-2/ { proxy_pass http://student-2-frontend:80/; include /etc/nginx/proxy_headers.conf; }
    location /student-3/ { proxy_pass http://student-3-frontend:80/; include /etc/nginx/proxy_headers.conf; }
    location /student-4/ { proxy_pass http://student-4-frontend:80/; include /etc/nginx/proxy_headers.conf; }
    location /student-5/ { proxy_pass http://student-5-frontend:80/; include /etc/nginx/proxy_headers.conf; }

    # --- Backend/API microservices --------------------------------------
    location /api/shared/    { proxy_pass http://shared-api:5000/;    include /etc/nginx/proxy_headers.conf; }
    location /api/student-1/ { proxy_pass http://student-1-api:5101/; include /etc/nginx/proxy_headers.conf; }
    location /api/student-2/ { proxy_pass http://student-2-api:5102/; include /etc/nginx/proxy_headers.conf; }
    location /api/student-3/ { proxy_pass http://student-3-api:5103/; include /etc/nginx/proxy_headers.conf; }
    location /api/student-4/ { proxy_pass http://student-4-api:5104/; include /etc/nginx/proxy_headers.conf; }
    location /api/student-5/ { proxy_pass http://student-5-api:5105/; include /etc/nginx/proxy_headers.conf; }
}
