# student-1 frontend microservice.
# Serves the Trips & Itinerary page, and resolves the shared theme and this
# feature's API so the page works both standalone (localhost:8081) and behind
# the unified home page (localhost:8080/student-1/).

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Only effective because proxy_pass below targets a
    # VARIABLE - nginx resolves a literal hostname once at startup and refuses
    # to boot if it is missing, which made this container's start order depend
    # on the hub's and vice versa.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /shared/ {
        set $shared_frontend http://shared-frontend:80;
        proxy_pass $shared_frontend;
        proxy_set_header Host $host;
    }

    location /api/student-1/ {
        set $own_api http://student-1-api:5101;
        rewrite ^/api/student-1/(.*)$ /$1 break;
        proxy_pass $own_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
