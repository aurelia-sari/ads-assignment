# student-1 frontend microservice.
# Serves the Trips & Itinerary page, and resolves the shared theme and this
# feature's API so the page works both standalone (localhost:8081) and behind
# the unified home page (localhost:8080/student-1/).

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /shared/ {
        proxy_pass http://shared-frontend:80/shared/;
        proxy_set_header Host $host;
    }

    location /api/student-1/ {
        proxy_pass http://student-1-api:5101/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
