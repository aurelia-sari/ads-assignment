repos:
  - repo: local
    hooks:
      - id: ruff-security
        name: Ruff security rules
        entry: python security/run_scan.py ruff
        language: python
        additional_dependencies: [ruff==0.17.1, pytest==9.1.1]
        pass_filenames: false
        always_run: true

      - id: detect-secrets
        name: detect-secrets
        entry: python security/run_scan.py secrets
        language: python
        additional_dependencies: [detect-secrets==1.5.0, pytest==9.1.1]
        pass_filenames: false
        always_run: true

      # Needs network access so it only runs when a requirements file is staged
      - id: pip-audit
        name: pip-audit
        entry: python security/run_scan.py pip_audit
        language: python
        additional_dependencies: [pip-audit==2.10.1, pytest==9.1.1]
        pass_filenames: false
        files: (^|/)requirements[^/]*\.txt$
