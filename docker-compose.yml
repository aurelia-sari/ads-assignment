# ---------------------------------------------------------------------------
# Group 25 - Travel App - Release 1
# One shared Docker Compose configuration for the containerised application.
#
#   ./scripts/ai_services.sh up        start the LOCAL AI services first
#   docker compose up --build          start the containerised application
#   open http://localhost:8080         unified home page
#
# Container inventory (18 containers):
#   shared-frontend, shared-api, shared-db                        (3)
#   student-{1..5}-{frontend,api,db}                             (15)
#
# NOT in this file, by Release 1 requirement: AI-Mode, the MCP server, the RAG
# server and the agentic loop all run on the host and are NOT compose services.
# They are managed by ./scripts/ai_services.sh. The containerised backends
# reach them through host.docker.internal, which is why every backend below
# declares an extra_hosts entry for it.
# ---------------------------------------------------------------------------

# Every backend/API reaches the three host-local AI services the same way, so
# the connection approach Release 0 used for AI-Mode is simply extended to MCP
# and RAG rather than replaced.
x-api-env: &api-env
  AI_MODE_URL: ${AI_MODE_URL:-http://host.docker.internal:5300}
  MCP_SERVER_URL: ${MCP_SERVER_URL:-http://host.docker.internal:5400}
  RAG_SERVER_URL: ${RAG_SERVER_URL:-http://host.docker.internal:5500}
  # CI runs the containerised microservices without the host-local AI services,
  # so MCP and RAG are switched off there rather than left to time out against
  # a host.docker.internal that has nothing behind it. The integration stays in
  # the image; only the runtime path is disabled. Both default to on locally.
  MCP_ENABLED: ${MCP_ENABLED:-true}
  RAG_ENABLED: ${RAG_ENABLED:-true}
  SHARED_API_URL: http://shared-api:5000

# host.docker.internal is how a container reaches a service on the host. The
# three local AI services live there, so every backend/API needs this.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:

  # --- Shared services ----------------------------------------------------

  shared-frontend:
    build: ./shared
    container_name: shared-frontend
    ports:
      - "8080:80"
    depends_on:
      - shared-api
    networks:
      - travel-network
    restart: unless-stopped

  shared-api:
    build:
      context: ./shared/api
    container_name: shared-api
    ports:
      - "5000:5000"
    environment:
      SHARED_DB_URL: http://shared-db:5200
    depends_on:
      - shared-db
    networks:
      - travel-network
    restart: unless-stopped

  shared-db:
    build:
      context: ./shared/db
    container_name: shared-db
    ports:
      - "5200:5200"
    volumes:
      - shared_db_data:/app/data
    networks:
      - travel-network
    restart: unless-stopped

  # Local dev-only fake SMTP server + web UI, used by student-4-api to send
  # sign-up verification emails without a real mail provider. Its web UI is
  # at http://localhost:8025. TODO (Aurelia Sari): swap for Resend in a
  # later release.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - travel-network
    restart: unless-stopped

  # --- Student 1 : Caroline Zhou - Trips & Itinerary (AI chatbot) ---------

  student-1-frontend:
    build: ./student-1/frontend
    container_name: student-1-frontend
    ports:
      - "8081:80"
    depends_on:
      - student-1-api
    networks:
      - travel-network
    restart: unless-stopped

  student-1-api:
    build: ./student-1/api
    container_name: student-1-api
    ports:
      - "5101:5101"
    environment:
      <<: *api-env
      DB_SERVICE_URL: http://student-1-db:5201
    depends_on:
      - student-1-db
      # Cross-feature reads: traveller records come from the shared access API.
      - shared-api
    extra_hosts: *host-gateway
    networks:
      - travel-network
    restart: unless-stopped

  student-1-db:
    build: ./student-1/db
    container_name: student-1-db
    ports:
      - "5201:5201"
    volumes:
      - student_1_db_data:/app/data
    networks:
      - travel-network
    restart: unless-stopped

  # --- Student 2 : Kevin Kim - Attractions, Dining, Recommendations -------

  student-2-frontend:
    build: ./student-2/frontend
    container_name: student-2-frontend
    ports:
      - "8082:80"
    depends_on:
      - student-2-api
    networks:
      - travel-network
    restart: unless-stopped

  student-2-api:
    build: ./student-2/api
    container_name: student-2-api
    ports:
      - "5102:5102"
    environment:
      <<: *api-env
      DB_SERVICE_URL: http://student-2-db:5202
    depends_on:
      - student-2-db
    extra_hosts: *host-gateway
    networks:
      - travel-network
    restart: unless-stopped

  student-2-db:
    build: ./student-2/db
    container_name: student-2-db
    ports:
      - "5202:5202"
    volumes:
      - student_2_db_data:/app/data
    networks:
      - travel-network
    restart: unless-stopped

  # --- Student 3 : Tanishpreet Kour - Travel Mate -------------------------

  student-3-frontend:
    build: ./student-3/frontend
    container_name: student-3-frontend
    ports:
      - "8083:80"
    depends_on:
      - student-3-api
    networks:
      - travel-network
    restart: unless-stopped

  student-3-api:
    build: ./student-3/api
    container_name: student-3-api
    ports:
      - "5103:5103"
    environment:
      <<: *api-env
      DB_SERVICE_URL: http://student-3-db:5203
    depends_on:
      - student-3-db
    extra_hosts: *host-gateway
    networks:
      - travel-network
    restart: unless-stopped

  student-3-db:
    build: ./student-3/db
    container_name: student-3-db
    ports:
      - "5203:5203"
    volumes:
      - student_3_db_data:/app/data
    networks:
      - travel-network
    restart: unless-stopped

  # --- Student 4 : Aurelia Sari - Auth, Profile, Dashboard, Guides --------

  student-4-frontend:
    build: ./student-4/frontend
    container_name: student-4-frontend
    ports:
      - "8084:80"
    depends_on:
      - student-4-api
    networks:
      - travel-network
    restart: unless-stopped

  student-4-api:
    build: ./student-4/api
    container_name: student-4-api
    ports:
      - "5104:5104"
    environment:
      <<: *api-env
      DB_SERVICE_URL: http://student-4-db:5204
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      MAIL_FROM: no-reply@nextstop.local
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    depends_on:
      - student-4-db
      # Cross-feature reads: user accounts and access logs come from the shared access API
      - shared-api
      - mailpit
    extra_hosts: *host-gateway
    networks:
      - travel-network
    restart: unless-stopped

  student-4-db:
    build: ./student-4/db
    container_name: student-4-db
    ports:
      - "5204:5204"
    volumes:
      - student_4_db_data:/app/data
    networks:
      - travel-network
    restart: unless-stopped

  # --- Student 5 : Aung Ko Khaing - Flights, Hotels, Cars, Budget ---------

  student-5-frontend:
    build: ./student-5/frontend
    container_name: student-5-frontend
    ports:
      - "8085:80"
    depends_on:
      - student-5-api
    networks:
      - travel-network
    restart: unless-stopped

  student-5-api:
    build: ./student-5/api
    container_name: student-5-api
    ports:
      - "5105:5105"
    environment:
      <<: *api-env
      DB_SERVICE_URL: http://student-5-db:5205
    depends_on:
      - student-5-db
    extra_hosts: *host-gateway
    networks:
      - travel-network
    restart: unless-stopped

  student-5-db:
    build: ./student-5/db
    container_name: student-5-db
    ports:
      - "5205:5205"
    volumes:
      - student_5_db_data:/app/data
    networks:
      - travel-network
    restart: unless-stopped

volumes:
  shared_db_data:
  student_1_db_data:
  student_2_db_data:
  student_3_db_data:
  student_4_db_data:
  student_5_db_data:

networks:
  travel-network:
    driver: bridge
