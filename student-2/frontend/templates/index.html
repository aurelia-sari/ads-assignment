<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextStop - Attractions & Dining</title>

    <!-- Same fonts as the shared NextStop landing page -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Shared theme -->
    <link rel="stylesheet" href="/shared/css/theme.css">

    <!-- HTMX -->
    <script src="/shared/js/htmx.min.js" defer></script>
    <script src="/student-4/session.js"></script>
    <script src="/shared/js/auth-guard.js"></script>

    <link rel="stylesheet" href="css/student-2.css?v=4">

</head>


<body>

<main class="app-shell" style="display:none">
    

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="app-header card">

        <h1>Attractions &amp; Dining</h1>

        <p>
            Student 2 · Kevin Kim ·
            <a href="/">back to all features</a>
        </p>

    </header>

    <!-- =========================================================
         DESCRIPTION
         ========================================================= -->

    <p class="feature-intro">
        Browse attractions, restaurants, and activities across Japan and Australia,
        save favourites, and receive AI-powered recommendations.
    </p>

    <!-- =========================================================
         TAB NAVIGATION
         ========================================================= -->

    <nav class="tab-nav">

        <button
            type="button"
            class="tab-btn is-active"
            data-tab="places">
            Places
        </button>

        <button
            type="button"
            class="tab-btn"
            data-tab="favourites">
            Favourites
        </button>

        <button
            type="button"
            class="tab-btn"
            data-tab="ai">
            AI mode
        </button>

        <button type="button" class="tab-btn" data-tab="mcp">MCP</button>

        <button type="button" class="tab-btn" data-tab="rag">RAG</button>

    </nav>


<!-- =========================================================
     PLACES
     ========================================================= -->

    <section
        id="panel-places"
        class="tab-panel is-active" data-fragment="tabs/places.html"></section>

    <!-- =========================================================
         FAVOURITES
         ========================================================= -->

    <section
        id="panel-favourites"
        class="tab-panel" data-fragment="tabs/favourites.html"></section>


    <!-- =========================================================
         AI MODE
         ========================================================= -->
        <section
            id="panel-ai"
            class="tab-panel card" data-fragment="tabs/ai-mode.html"></section>
    <section id="panel-mcp" class="tab-panel card" data-fragment="tabs/mcp.html"></section>
    <section id="panel-rag" class="tab-panel card" data-fragment="tabs/rag.html"></section>
</main>


<!-- =============================================================
     TAB SCRIPT
     ============================================================= -->

<script src="js/student-2.js?v=2" defer></script>

</body>
</html>
