# Build and validate the student-5 microservices (Bookings & Budget).
# Owner: Aung Ko Khaing
name: student-5

on:
  push:
    branches: [main]
    paths:
      - 'student-5/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
  pull_request:
    paths:
      - 'student-5/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-5.yml'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: student-5 - Bookings & Budget
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the shared repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the student-5 source
        run: python -m compileall -q student-5

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build the student-5 microservices
        run: |
          docker compose build \
            student-5-frontend \
            student-5-api \
            student-5-db

      - name: Start the student-5 microservices
        # Release 1: the MCP and RAG integration stays in the image, but
        # both are disabled here. The shared MCP and RAG servers are not
        # containerised, so they do not exist on a CI runner - leaving
        # them enabled would mean every AI path waits for a timeout.
        env:
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
        run: |
          docker compose up -d \
            shared-frontend \
            student-5-db \
            student-5-api \
            student-5-frontend

      - name: Wait for the services to report healthy
        run: python3 scripts/wait_for_health.py 5205 5105 8085 8080

      - name: Validate CRUD through the database and backend APIs
        run: python3 scripts/smoke_test.py 5

      # Release 2, criterion 4: post-commit tests for two endpoint functions of
      # student-5-api, update_budget (PUT /budgets/<id>) and add_selection
      # (POST /selections), run against the containers started above.
      - name: Install the endpoint test dependencies
        run: python -m pip install -r student-5/tests/requirements.txt

      - name: Test two student-5-api endpoint functions
        run: >-
          python -m pytest -v
          student-5/tests/test_endpoints.py
          --junitxml=reports/student-5-endpoint-tests.xml

      - name: Publish the endpoint test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("reports/student-5-endpoint-tests.xml")
          print("## student-5 post-commit endpoint tests")
          if not path.exists():
              print("No report was produced.")
          else:
              root = ET.parse(path).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              print(f"tests {suite.get('tests')}, failures {suite.get('failures')}, errors {suite.get('errors')}")
              for case in suite.iter("testcase"):
                  bad = case.find("failure") is not None or case.find("error") is not None
                  print(f"- {'FAIL' if bad else 'PASS'} {case.get('name')}")
          PY

      - name: Confirm the frontend microservice serves its page
        run: curl --fail --silent --show-error http://localhost:8085 > /dev/null

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down --volumes
