# Build and validate the student-2 microservices (Attractions & Dining).
# Owner: Kevin Kim
name: student-2

on:
  push:
    branches: [main]
    paths:
      - 'student-2/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-2.yml'
  pull_request:
    paths:
      - 'student-2/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-2.yml'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: student-2 - Attractions & Dining
    runs-on: ubuntu-latest

    steps:
      - name: Check out the shared repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the student-2 source
        run: python -m compileall -q student-2

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build the student-2 microservices
        run: |
          docker compose build \
            student-2-frontend \
            student-2-api \
            student-2-db

      - name: Start the student-2 microservices
        run: |
          docker compose up -d \
            shared-frontend \
            ai-mode \
            student-2-db \
            student-2-api \
            student-2-frontend

      - name: Wait for the services to report healthy
        run: python3 scripts/wait_for_health.py 5202 5102 5300 8082 8080

      - name: Validate CRUD through the database and backend APIs
        run: python3 scripts/smoke_test.py 2

      - name: Confirm the frontend microservice serves its page
        run: curl --fail --silent --show-error http://localhost:8082 > /dev/null

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down --volumes
