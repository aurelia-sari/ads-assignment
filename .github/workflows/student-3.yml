# Build and validate the student-3 microservices (Travel Mate).
# Owner: Tanishpreet Kour
name: student-3

on:
  push:
    branches: [main]
    paths:
      - 'student-3/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
  pull_request:
    paths:
      - 'student-3/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: student-3 - Travel Mate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the shared repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the student-3 source
        run: python -m compileall -q student-3

      - name: Install the student-3 API dependencies and pytest
        run: pip install -r student-3/api/requirements.txt pytest

      # Release 2, criterion 4: post-commit tests for two endpoint functions
      # of the student-3 backend/API service: browse_trips (GET /trips) and
      # multi_agent_start (POST /ai/multi-agent). The shared AI services are
      # stubbed or disabled, so these run on a plain CI runner.
      - name: Post-commit endpoint tests - GET /trips and POST /ai/multi-agent
        env:
          MULTI_AGENT_ENABLED: 'false'
        run: >-
          python -m pytest -v
          student-3/tests/test_multi_agent_api.py
          -k "test_browse_trips_returns_trip_cards or test_multi_agent_start_reports_switched_off"
          --junitxml=reports/student-3-endpoint-tests.xml

      - name: Publish the endpoint test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("reports/student-3-endpoint-tests.xml")
          if not path.exists():
              print("## student-3 endpoint tests\n\nNo report: the tests did not run.")
              raise SystemExit
          suite = ET.parse(path).getroot().find("testsuite")
          print("## student-3 endpoint tests (GET /trips, POST /ai/multi-agent)\n")
          print(f"{suite.get('tests')} tests, {suite.get('failures')} failures, "
                f"{suite.get('errors')} errors, {float(suite.get('time')):.2f}s\n")
          print("| Test | Result |\n|---|---|")
          for case in suite.iter("testcase"):
              failed = case.find("failure") is not None or case.find("error") is not None
              print(f"| `{case.get('name')}` | {'FAIL' if failed else 'pass'} |")
          PY

      - name: Upload the endpoint test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-endpoint-tests
          path: reports/student-3-endpoint-tests.xml
          if-no-files-found: ignore

      - name: Full student-3 test suite
        env:
          MULTI_AGENT_ENABLED: 'false'
        run: python -m pytest student-3/tests -v

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build the student-3 microservices
        run: |
          docker compose build \
            student-3-frontend \
            student-3-api \
            student-3-db

      - name: Start the student-3 microservices
        # Release 1: the MCP and RAG integration stays in the image, but
        # both are disabled here. The shared MCP and RAG servers are not
        # containerised, so they do not exist on a CI runner - leaving
        # them enabled would mean every AI path waits for a timeout.
        env:
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
        run: |
          docker compose up -d \
            shared-frontend \
            student-3-db \
            student-3-api \
            student-3-frontend

      - name: Wait for the services to report healthy
        run: python3 scripts/wait_for_health.py 5203 5103 8083 8080

      - name: Validate CRUD through the database and backend APIs
        run: python3 scripts/smoke_test.py 3

      - name: Confirm the frontend microservice serves its page
        run: curl --fail --silent --show-error http://localhost:8083 > /dev/null

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down --volumes
