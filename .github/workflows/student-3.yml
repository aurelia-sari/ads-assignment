# Build and validate the student-3 microservices (Travel Mate).
# Owner: Tanishpreet Kour
name: student-3

on:
  push:
    branches: [main]
    paths:
      - 'student-3/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
  pull_request:
    paths:
      - 'student-3/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-3.yml'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: student-3 - Travel Mate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the shared repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the student-3 source
        run: python -m compileall -q student-3

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build the student-3 microservices
        run: |
          docker compose build \
            student-3-frontend \
            student-3-api \
            student-3-db

      - name: Start the student-3 microservices
        # Release 1: the MCP and RAG integration stays in the image, but
        # both are disabled here. The shared MCP and RAG servers are not
        # containerised, so they do not exist on a CI runner - leaving
        # them enabled would mean every AI path waits for a timeout.
        env:
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
        run: |
          docker compose up -d \
            shared-frontend \
            student-3-db \
            student-3-api \
            student-3-frontend

      - name: Wait for the services to report healthy
        run: python3 scripts/wait_for_health.py 5203 5103 8083 8080

      - name: Validate CRUD through the database and backend APIs
        run: python3 scripts/smoke_test.py 3

      - name: Confirm the frontend microservice serves its page
        run: curl --fail --silent --show-error http://localhost:8083 > /dev/null

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down --volumes
