# Build and validate the student-1 microservices (Trips & Itinerary).
# Owner: Caroline Zhou
name: student-1

on:
  push:
    branches: [main]
    paths:
      - 'student-1/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  pull_request:
    paths:
      - 'student-1/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-1.yml'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: student-1 - Trips & Itinerary
    runs-on: ubuntu-latest

    steps:
      - name: Check out the shared repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the student-1 source
        run: python -m compileall -q student-1

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build the student-1 microservices
        run: |
          docker compose build \
            student-1-frontend \
            student-1-api \
            student-1-db

      - name: Start the student-1 microservices
        # Release 1: the AI-Mode, MCP and RAG integration stays in the
        # image, but all three are disabled here. None of them is
        # containerised, so they do not exist on a CI runner - leaving
        # them enabled would mean every AI path waits for a timeout.
        env:
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
        run: |
          docker compose up -d \
            shared-frontend \
            student-1-db \
            student-1-api \
            student-1-frontend

      - name: Wait for the services to report healthy
        run: python3 scripts/wait_for_health.py 5201 5101 8081 8080

      - name: Validate CRUD through the database and backend APIs
        run: python3 scripts/smoke_test.py 1

      # Release 2, criterion 4: post-commit tests for two endpoint functions
      # of student-1-api, create_trip (POST /trips) and list_trip_days
      # (GET /trips/<id>/days), run against the containers started above.
      - name: Install the endpoint test dependencies
        run: python -m pip install -r student-1/tests/requirements.txt

      - name: Test two student-1-api endpoint functions
        run: >-
          python -m pytest -v
          student-1/tests/test_endpoints.py
          --junitxml=reports/student-1-endpoint-tests.xml

      - name: Publish the endpoint test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("reports/student-1-endpoint-tests.xml")
          if not path.exists():
              print("## student-1 endpoint tests\n\nNo report: the tests did not run.")
              raise SystemExit
          suite = ET.parse(path).getroot().find("testsuite")
          print("## student-1 endpoint tests (create_trip, list_trip_days)\n")
          print(f"{suite.get('tests')} tests, {suite.get('failures')} failures, "
                f"{suite.get('errors')} errors, {float(suite.get('time')):.2f}s\n")
          print("| Test | Result |\n|---|---|")
          for case in suite.iter("testcase"):
              failed = case.find("failure") is not None or case.find("error") is not None
              print(f"| `{case.get('name')}` | {'FAIL' if failed else 'pass'} |")
          PY

      - name: Upload the endpoint test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-1-endpoint-tests
          path: reports/student-1-endpoint-tests.xml
          if-no-files-found: ignore

      - name: Confirm the frontend microservice serves its page
        run: curl --fail --silent --show-error http://localhost:8081 > /dev/null

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down --volumes
