# Build and validate the student-4 microservices (Account & Dashboard).
# Owner: Aurelia Sari
name: student-4

on:
  push:
    branches: [main]
    paths:
      - 'student-4/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-4.yml'
  pull_request:
    paths:
      - 'student-4/**'
      - 'shared/**'
      - 'ai-services/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-4.yml'
  workflow_dispatch:

jobs:
  build-and-validate:
    name: student-4 - Account & Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Check out the shared repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install student-4 test dependencies
        run: python -m pip install -r student-4/tests/requirements.txt

      - name: Byte-compile the student-4 source
        run: python -m compileall -q student-4

      # Release 2, criterion 4: pre-commit pytest validation. The unit tests
      # stub every service, so they run before anything is built.
      - name: Pre-commit pytest validation of the unit tests, with no services running
        run: >-
          python -m pytest -q
          --junitxml=reports/student-4-unit-tests.xml
          student-4/tests/test_agents.py
          student-4/tests/test_ai_tools.py
          student-4/tests/test_ai_mode_flag.py
          student-4/tests/test_currency_request.py
          student-4/tests/test_currency_validation.py
          student-4/tests/test_exchange_rates.py
          student-4/tests/test_init_db.py
          student-4/tests/test_orchestrator.py
          student-4/tests/test_weather.py

      - name: Validate the shared Docker Compose configuration
        run: docker compose config --quiet

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build the student-4 microservices
        run: |
          docker compose build \
            student-4-frontend \
            student-4-api \
            student-4-db

      - name: Start the student-4 microservices
        # Release 1: the AI-Mode, MCP and RAG integrations stay in the image,
        # but all three are disabled here. They are not containerised, so they
        # do not exist on a CI runner, and leaving them enabled would mean
        # every AI path waits for a timeout.
        # Live exchange rates and weather are switched off too, so CI never
        # depends on the internet.
        env:
          AI_MODE_ENABLED: 'false'
          MCP_ENABLED: 'false'
          RAG_ENABLED: 'false'
          MULTI_AGENT_ENABLED: 'false'
          GUIDES_LIVE_DATA: 'false'
        run: |
          docker compose up -d \
            shared-frontend \
            shared-api \
            shared-db \
            mailpit \
            student-4-db \
            student-4-api \
            student-4-frontend

      - name: Wait for the services to report healthy
        run: python3 scripts/wait_for_health.py 5204 5104 5000 5200 8084 8080

      - name: Validate CRUD through the database and backend APIs
        run: python3 scripts/smoke_test.py 4

      # Release 2, criterion 4: post-commit tests for two endpoint functions of
      # student-4-api, list_guides (GET /guides) and start (POST /ai/agents),
      # run against the containers started above.
      - name: Test two student-4-api endpoint functions
        env:
          MULTI_AGENT_ENABLED: 'false'
        run: >-
          python -m pytest -v
          student-4/tests/test_endpoints.py
          --junitxml=reports/student-4-endpoint-tests.xml

      - name: Publish the endpoint test report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("reports/student-4-endpoint-tests.xml")
          if not path.exists():
              print("## student-4 endpoint tests\n\nNo report: the tests did not run.")
              raise SystemExit
          suite = ET.parse(path).getroot().find("testsuite")
          print("## student-4 endpoint tests (list_guides, start)\n")
          print(f"{suite.get('tests')} tests, {suite.get('failures')} failures, "
                f"{suite.get('errors')} errors, {float(suite.get('time')):.2f}s\n")
          print("| Test | Result |\n|---|---|")
          for case in suite.iter("testcase"):
              failed = case.find("failure") is not None or case.find("error") is not None
              print(f"| `{case.get('name')}` | {'FAIL' if failed else 'pass'} |")
          PY

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-4-test-reports
          path: reports/*.xml
          if-no-files-found: ignore

      - name: Confirm the frontend microservice serves its page
        run: curl --fail --silent --show-error http://localhost:8084 > /dev/null

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --tail 80

      - name: Tear down
        if: always()
        run: docker compose down --volumes
