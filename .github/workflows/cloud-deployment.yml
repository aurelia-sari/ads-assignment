name: cloud-deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_cloud_ai:
        description: Enable the shared AI-Mode, MCP, RAG and Multi-Agent services
        type: boolean
        required: true
        default: false
      ollama_model:
        description: Ollama model used by the shared cloud AI service
        type: string
        required: true
        default: llama3.2:latest
  pull_request:
    paths:
      - 'deploy/azure/**'
      - 'ai-services/**'
      - 'tests/cloud/**'
      - 'docker-compose.cloud.yml'
      - '.github/workflows/cloud-deployment.yml'
      - '.github/workflows/student-*.yml'

concurrency:
  group: cloud-deployment-${{ github.event_name == 'pull_request' && github.ref || 'vm' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cloud test dependencies
        run: python -m pip install -r ai-services/multi-agent-server/requirements.txt -r ai-services/ai-mode/requirements.txt pytest==9.1.1
      - name: Check deployment shell scripts
        run: shellcheck deploy/azure/deploy.sh deploy/azure/deploy_remote.sh deploy/azure/configure_ai.sh deploy/azure/run_ai_service.sh deploy/azure/smoke_cloud.sh
      - name: Test cloud configuration and failure handling without a VM
        run: python -B -m unittest discover -s tests/cloud -p 'test_*.py' -v
      - name: Test shared Multi-Agent execution and recovery
        run: python -B -m pytest -q -p no:cacheprovider ai-services/multi-agent-server/tests
      - name: Test shared RAG citation handling
        run: python -B -m pytest -q -p no:cacheprovider ai-services/rag-server/tests
      - name: Test AI-Mode structured output transport
        run: python -B -m pytest -q -p no:cacheprovider ai-services/ai-mode/tests
      - name: Validate cloud Compose with shared AI off and on
        run: |
          for enabled in false true; do
            AI_MODE_ENABLED=$enabled MCP_ENABLED=$enabled RAG_ENABLED=$enabled MULTI_AGENT_ENABLED=$enabled \
            docker compose -f docker-compose.yml -f docker-compose.cloud.yml config --quiet
          done

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      ENABLE_CLOUD_AI: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_cloud_ai && 'true' || 'false' }}
      CLOUD_OLLAMA_MODEL: ${{ inputs.ollama_model || 'llama3.2:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate on student CI/CD workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 deploy/azure/wait_for_student_ci.py

      - name: Install SSH key
        if: steps.gate.outputs.ok == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/nextstop_deploy
          chmod 600 ~/.ssh/nextstop_deploy

      - name: Retain cloud AI selection for automatic deployments
        if: steps.gate.outputs.ok == 'true' && github.event_name == 'push'
        run: |
          selection=$(ssh -i ~/.ssh/nextstop_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "azureuser@$VM_HOST" 'selection="$HOME/.local/share/nextstop/cloud-ai-selection"; if [ -f "$selection" ]; then cat "$selection"; else printf "false\nllama3.2:latest\n"; fi')
          IFS= read -r enabled <<< "$selection"
          model=$(printf '%s\n' "$selection" | sed -n '2p')
          line_count=$(printf '%s\n' "$selection" | wc -l | tr -d ' ')
          if [ "$line_count" != 2 ]; then
            echo 'Stored cloud AI selection must contain exactly two lines.' >&2
            exit 1
          fi
          case "$enabled" in true|false) ;; *) echo 'Invalid stored cloud AI selection.' >&2; exit 1 ;; esac
          [[ "$model" =~ ^[[:alnum:]][[:alnum:]_.:/-]*$ ]] || { echo 'Invalid stored cloud model.' >&2; exit 1; }
          printf 'ENABLE_CLOUD_AI=%s\nCLOUD_OLLAMA_MODEL=%s\n' "$enabled" "$model" >> "$GITHUB_ENV"
          echo "Retaining shared cloud AI enabled=$enabled."

      - name: Deploy application and selected shared AI runtime to Azure VM
        if: steps.gate.outputs.ok == 'true'
        run: bash deploy/azure/deploy.sh

      - name: Validate cloud deployment
        if: steps.gate.outputs.ok == 'true'
        run: bash deploy/azure/smoke_cloud.sh

      - name: Summary
        if: steps.gate.outputs.ok == 'true'
        run: echo "Deployed to http://$VM_HOST (shared cloud AI enabled=$ENABLE_CLOUD_AI)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/nextstop_deploy
